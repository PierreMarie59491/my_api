nelmio_cors:
    defaults:
        allow_origin: ['*']  # Autoriser React
        allow_methods: ['GET', 'POST', 'PUT', 'DELETE', 'OPTIONS']
        allow_headers: ['Content-Type', 'Authorization']
        expose_headers: ['Content-Type']
        max_age: 3600
        hosts: []
    paths:
        '^/api/':  # Appliquer cette règle aux routes API
            allow_origin: ['*']
            allow_headers: ['Content-Type', 'Authorization']
            allow_methods: ['GET', 'POST', 'PUT', 'DELETE', 'OPTIONS']
            max_age: 3600
